<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラー一覧 - シフト希望 - りんごちゃん薬局</title>
  <meta name="description" content="りんごちゃん薬局 シフト希望管理 - スタッフ設定画面">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module">
    import { supabase } from './js/supabase-config.js';
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) window.location.replace('login.html');
    } catch (e) {
      console.error('認証チェックエラー:', e);
      window.location.replace('login.html');
    }
  </script>
</head>
<body>
  <!-- ヘッダー -->
  <header class="app-header">
    <div class="app-header__title">
      <i data-lucide="palette" style="width:20px;height:20px;"></i>
      カラー設定
    </div>
    <nav class="app-header__nav">
      <a href="index.html" class="app-header__link"><i data-lucide="calendar" style="width:16px;height:16px;"></i> 希望休</a>
      <a href="generate.html" class="app-header__link"><i data-lucide="calendar-cog" style="width:16px;height:16px;"></i> シフト生成</a>
      <a href="admin.html" class="app-header__link" style="color:var(--color-primary);font-weight:600;"><i data-lucide="palette" style="width:16px;height:16px;"></i> 設定</a>
      <button id="btn-logout" class="app-header__link" style="background:none;border:none;cursor:pointer;color:var(--color-text-secondary);display:flex;align-items:center;gap:4px;font-size:inherit;padding:0;"><i data-lucide="log-out" style="width:16px;height:16px;"></i> ログアウト</button>
    </nav>
  </header>

  <div class="admin-container">
    <h2>モバイルでのスタッフカラー設定</h2>



    <!-- スタッフリスト -->
    <div class="staff-list" id="staff-list">
      <!-- JSで動的に生成 -->
    </div>

    <!-- 保存アクション -->
    <div style="margin-top: 32px; text-align: center;">
      <button class="btn btn--primary" id="save-colors-btn" style="padding: 12px 32px; font-size: 1rem;">
        <i data-lucide="save" style="width:20px;height:20px;margin-right:8px;"></i> 設定を保存する
      </button>
    </div>
  </div>


  <!-- トースト -->
  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="js/admin.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
