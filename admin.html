<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カラー一覧 - シフト希望 - りんごちゃん薬局</title>
  <meta name="description" content="りんごちゃん薬局 シフト希望管理 - スタッフ設定画面">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module">
    import { supabase } from './js/supabase-config.js';
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) window.location.replace('login.html');
    } catch (e) {
      console.error('認証チェックエラー:', e);
      window.location.replace('login.html');
    }
  </script>
</head>
<body>
  <!-- ヘッダー -->
  <header class="app-header">
    <!-- 左グループ：タイトル + ナビ -->
    <div class="app-header__left">
      <div class="app-header__title">
        <i data-lucide="palette" class="icon-xl"></i>
        <span class="app-title-text">カラー設定</span>
      </div>
      <div class="header-divider"></div>
      <nav class="app-header__nav">
        <a href="index.html" class="app-header__link"><i data-lucide="calendar" class="icon-md"></i> 希望休</a>
        <a href="generate.html" class="app-header__link"><i data-lucide="calendar-cog" class="icon-md"></i> シフト生成</a>
      </nav>
    </div>

    <!-- 右グループ：ログアウト -->
    <div class="app-header__right">
      <button id="btn-logout" class="app-header__logout">
        <i data-lucide="log-out" class="icon-sm"></i> ログアウト
      </button>
    </div>
  </header>

  <div class="admin-container">
    <h2>モバイルでのスタッフカラー設定</h2>



    <!-- スタッフリスト -->
    <div class="staff-list" id="staff-list">
      <!-- JSで動的に生成 -->
    </div>

    <!-- 保存アクション -->
    <div class="admin-actions">
      <button class="btn btn--primary btn--lg" id="save-colors-btn">
        <i data-lucide="save" class="icon-xl"></i> 設定を保存する
      </button>
    </div>
  </div>


  <!-- トースト -->
  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="js/admin.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
