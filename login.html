<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - りんごちゃん薬局 シフト管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=2">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.05) 0%, rgba(16, 185, 129, 0.05) 100%);
    }

    .login-container {
      width: 100%;
      max-width: 360px;
      padding: 40px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      box-shadow: 
        0 4px 6px rgba(0, 0, 0, 0.02),
        0 20px 40px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255,255,255,1);
      border: 1px solid rgba(255,255,255, 0.5);
    }

    .login-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      background: var(--color-primary-bg);
      color: var(--color-primary);
      border-radius: 16px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.5);
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-bottom: 24px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: var(--color-surface);
      color: var(--color-text);
      transition: all 0.2s ease;
      outline: none;
      box-sizing: border-box;
    }

    .input-group input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .error-message {
      color: var(--color-danger);
      font-size: 13px;
      font-weight: 500;
      min-height: 20px;
      margin-bottom: 16px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .error-message.is-visible {
      opacity: 1;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      justify-content: center;
      margin-top: 8px;
    }
  </style>
</head>
<body class="theme-layered">

  <div class="login-container">
    <div class="login-icon">
      <i data-lucide="lock" style="width:28px;height:28px;"></i>
    </div>
    <h1 class="login-title">りんごちゃん薬局 シフト管理</h1>
    <p class="login-subtitle">メールアドレスとパスワードを入力</p>

    <div class="input-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" placeholder="example@example.com" required>
    </div>
    
    <div class="input-group">
      <label for="password">パスワード</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <div class="error-message" id="error-msg"></div>

    <button class="btn btn--primary btn-login" id="btn-submit">
      ログイン
      <i data-lucide="arrow-right" style="width:18px;height:18px;margin-left:6px;"></i>
    </button>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-config.js';
    
    lucide.createIcons();

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('btn-submit');
    const errorMsg = document.getElementById('error-msg');

    // 初期化時にセッション確認
    document.addEventListener('DOMContentLoaded', async () => {
      // すでにログイン状態ならindex.htmlへ遷移
      const { data: { session }, error } = await supabase.auth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    });

    submitBtn.addEventListener('click', handleLogin);

    // Enterキー対応
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
      });
    });

    async function handleLogin() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('メールアドレスとパスワードを入力してください');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'ログイン中...';
      clearError();

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          showError('ログインに失敗しました: ' + error.message);
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'ログイン <i data-lucide="arrow-right" style="width:18px;height:18px;margin-left:6px;"></i>';
          lucide.createIcons();
        } else {
          // ログイン成功
          submitBtn.style.background = 'var(--color-success)';
          submitBtn.style.color = '#fff';
          submitBtn.innerHTML = '認証成功 <i data-lucide="check" style="width:18px;height:18px;margin-left:6px;"></i>';
          lucide.createIcons();
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);
        }
      } catch (err) {
        console.error('Login exception:', err);
        showError('システムエラーが発生しました。コンソールを確認してください。');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'ログイン <i data-lucide="arrow-right" style="width:18px;height:18px;margin-left:6px;"></i>';
        lucide.createIcons();
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('is-visible');
    }

    function clearError() {
      errorMsg.classList.remove('is-visible');
    }
  </script>
</body>
</html>
